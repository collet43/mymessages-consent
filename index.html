<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Texting Preferences</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-width: 420px;
    width: 100%;
    padding: 28px 24px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.5; color: #444; margin: 0 0 20px; }
  label {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.5;
    text-align: left;
    background: #f0f0f0;
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
  }
  input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
  .muted { color: #666; font-size: 13px; margin-top: 14px; margin-bottom: 0; }
  .spinner { color: #666; font-size: 15px; }
  button {
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <p class="spinner">Loading…</p>
  </div>

<script>
  const SUPABASE_URL = 'https://nzolnhppatvvpoffvmof.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56b2xuaHBwYXR2dnBvZmZ2bW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzcxNTQsImV4cCI6MjEwNDAxMzE1NH0.FHzscihazd5sbNsBSmjDDLiGmfumXLLigeaQMPlbgws';

  const card = document.getElementById('card');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');

  function render(html) { card.innerHTML = html; }

  function renderError(message) {
    render(`<h1>Texting Preferences</h1><p>${message}</p>`);
  }

  function renderThankYou() {
    render(`
      <h1>Thanks!</h1>
      <p>You're all set — we'll keep you posted by text.</p>
    `);
  }

  async function callRpc(fn, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('request failed');
    return res.json();
  }

  // No Submit button — checking the box IS the action. Nothing on this
  // page ever records a "no": leaving it unchecked, or just closing the
  // tab, simply leaves your preference as it was.
  function renderForm(firstName, alreadyResponded) {
    const greeting = firstName ? `Hi ${firstName} — ` : "Hi there — ";
    render(`
      <h1>Texting Preferences</h1>
      <p>${greeting}check the box below any time you'd like to start getting texts from us.</p>
      <label>
        <input type="checkbox" id="consent-box" />
        <span>By checking this box, I agree to receive text messages from us at the number provided. Message and data rates may apply. Reply STOP at any time to stop.</span>
      </label>
      ${alreadyResponded ? '<p class="muted">You\'ve already opted in before — checking this again just reconfirms it.</p>' : ''}
    `);

    document.getElementById('consent-box').addEventListener('change', async (e) => {
      if (!e.target.checked) return;
      e.target.disabled = true;
      try {
        await callRpc('record_opt_in_response', { p_token: token, p_consent: true });
        renderThankYou();
      } catch (err) {
        render(`
          <h1>Texting Preferences</h1>
          <p>Something went wrong submitting that. Please try again.</p>
          <button id="retry-btn">Try Again</button>
        `);
        document.getElementById('retry-btn').addEventListener('click', () => renderForm(firstName, alreadyResponded));
      }
    });
  }

  async function init() {
    if (!token) {
      renderError('This link is missing information — please ask for a new one.');
      return;
    }
    try {
      const rows = await callRpc('get_opt_in_prompt', { p_token: token });
      if (!rows || rows.length === 0) {
        renderError('This link is invalid or has expired. Please contact us directly.');
        return;
      }
      const { first_name, already_responded } = rows[0];
      renderForm(first_name, already_responded);
    } catch (e) {
      renderError('Something went wrong loading this page. Please try again in a moment.');
    }
  }

  init();
</script>
</body>
</html>
