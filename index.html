<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Texting Preferences</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #1a56c4, #2f76e8);
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    max-width: 420px;
    width: 100%;
    padding: 32px 26px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.5; color: #444; margin: 0 0 20px; }
  label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    text-align: left;
    background: #eaf1fd;
    border: 1px solid #cfe0fb;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: #1a56c4; }
  button {
    width: 100%;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    background: #f4b400;
    color: #1a1a1a;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #e0a600; }
  button:disabled { background: #f7dfa1; color: #8a7548; cursor: default; }
  .muted { color: #666; font-size: 14px; }
  .spinner { color: #666; font-size: 15px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <p class="spinner">Loading…</p>
  </div>

<script>
  const SUPABASE_URL = 'https://nzolnhppatvvpoffvmof.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56b2xuaHBwYXR2dnBvZmZ2bW9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MzcxNTQsImV4cCI6MjEwNDAxMzE1NH0.FHzscihazd5sbNsBSmjDDLiGmfumXLLigeaQMPlbgws';

  const card = document.getElementById('card');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');

  function render(html) { card.innerHTML = html; }

  function renderError(message) {
    render(`<h1>Texting Preferences</h1><p>${message}</p>`);
  }

  function renderThankYou(consented) {
    render(`
      <h1>Thanks!</h1>
      <p>${consented ? "You're all set — we'll keep you posted by text." : "Got it — we won't text you."}</p>
    `);
  }

  async function callRpc(fn, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('request failed');
    return res.json();
  }

  function renderForm(firstName, alreadyResponded) {
    const greeting = firstName ? `Hi ${firstName} — ` : '';
    render(`
      <h1>Texting Preferences</h1>
      <p>${greeting}check the box below if you'd like to receive texts from us.</p>
      <label>
        <input type="checkbox" id="consent-box" />
        Yes, text me
      </label>
      ${alreadyResponded ? '<p class="muted">You\'ve already responded before — submitting again just updates your preference.</p>' : ''}
      <button id="submit-btn">Submit</button>
    `);

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const btn = document.getElementById('submit-btn');
      const consented = document.getElementById('consent-box').checked;
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        await callRpc('record_opt_in_response', { p_token: token, p_consent: consented });
        renderThankYou(consented);
      } catch (e) {
        render(`
          <h1>Texting Preferences</h1>
          <p>Something went wrong submitting that. Please try again.</p>
          <button id="retry-btn">Try Again</button>
        `);
        document.getElementById('retry-btn').addEventListener('click', () => renderForm(firstName, alreadyResponded));
      }
    });
  }

  async function init() {
    if (!token) {
      renderError('This link is missing information — please ask for a new one.');
      return;
    }
    try {
      const rows = await callRpc('get_opt_in_prompt', { p_token: token });
      if (!rows || rows.length === 0) {
        renderError('This link is invalid or has expired. Please contact us directly.');
        return;
      }
      const { first_name, already_responded } = rows[0];
      renderForm(first_name, already_responded);
    } catch (e) {
      renderError('Something went wrong loading this page. Please try again in a moment.');
    }
  }

  init();
</script>
</body>
</html>
